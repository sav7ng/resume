<!doctype html>
<html lang="{{PAGE_LANG}}" data-theme-mode="system" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{PAGE_DESCRIPTION}}">
    <meta id="theme-color" name="theme-color" content="#ffffff">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="{{PAGE_TITLE}}">
    <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
    <title>{{PAGE_TITLE}}</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2309090b'/%3E%3Cpath d='M44 19H25c-5 0-8 3-8 8s3 8 8 8h14c2 0 3 1 3 3s-1 3-3 3H19v7h20c7 0 11-4 11-11 0-6-4-10-11-10H25c-1 0-2-1-2-2s1-2 2-2h19z' fill='white'/%3E%3C/svg%3E">
    <script>
        (function () {
            var storageKey = "resume-theme-mode";
            var root = document.documentElement;
            var mediaQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
            var storedMode = "system";

            try {
                var savedMode = localStorage.getItem(storageKey);
                if (savedMode === "light" || savedMode === "dark" || savedMode === "system") {
                    storedMode = savedMode;
                }
            } catch (error) {
                storedMode = "system";
            }

            var resolvedTheme = storedMode === "system"
                ? ((mediaQuery && mediaQuery.matches) ? "dark" : "light")
                : storedMode;

            root.dataset.themeMode = storedMode;
            root.dataset.theme = resolvedTheme;
            root.style.colorScheme = resolvedTheme;
            document.getElementById("theme-color").setAttribute(
                "content",
                resolvedTheme === "dark" ? "#09090b" : "#ffffff"
            );
        }());
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --background: oklch(1 0 0);
            --foreground: oklch(0.141 0.005 285.823);
            --surface: oklch(0.985 0 0);
            --surface-strong: oklch(0.967 0.001 286.375);
            --muted: oklch(0.967 0.001 286.375);
            --muted-foreground: oklch(0.552 0.016 285.938);
            --border: oklch(0.92 0.004 286.32);
            --line: color-mix(in oklab, var(--border) 64%, var(--background));
            --focus: oklch(0.141 0.005 285.823);
            --selection: oklch(0.141 0.005 285.823);
            --selection-foreground: oklch(0.985 0 0);
            --diagram-soft: color-mix(in oklab, var(--foreground) 8%, transparent);
            --header-background: color-mix(in oklab, var(--background) 88%, transparent);
            --content-width: 768px;
            --header-height: 50px;
            --rail-padding: clamp(18px, 4vw, 32px);
            --hairline: 1px;
            --pattern-foreground: color-mix(in oklab, var(--border) 72%, transparent);
            --separator-height: 32px;
            --font-sans: "Geist", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
            --font-mono: "Geist Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --duration: 460ms;
        }

        html[data-theme="dark"] {
            --background: oklch(0.141 0.005 285.823);
            --foreground: oklch(0.985 0 0);
            --surface: oklch(0.18 0.006 285.9);
            --surface-strong: oklch(0.21 0.006 285.885);
            --muted: oklch(0.274 0.006 286.033);
            --muted-foreground: oklch(0.705 0.015 286.067);
            --border: oklch(0.274 0.006 286.033);
            --line: color-mix(in oklab, var(--border) 64%, var(--background));
            --focus: oklch(0.985 0 0);
            --selection: oklch(0.985 0 0);
            --selection-foreground: oklch(0.141 0.005 285.823);
            --diagram-soft: color-mix(in oklab, var(--foreground) 7%, transparent);
            --header-background: color-mix(in oklab, var(--background) 88%, transparent);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--header-height) + 20px);
            background: var(--background);
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100dvh;
            overflow-x: clip;
            background: var(--background);
            color: var(--foreground);
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            font-synthesis-weight: none;
            text-rendering: optimizeLegibility;
            transition: background-color 180ms ease, color 180ms ease;
        }

        /* 高分屏使用半像素细线，让工程图纸的线条更锐利 */
        @media (min-resolution: 2dppx) {
            :root {
                --hairline: 0.5px;
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            border-radius: 5px;
            background: var(--border);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background-image:
                linear-gradient(to right, var(--diagram-soft) 1px, transparent 1px),
                linear-gradient(to bottom, var(--diagram-soft) 1px, transparent 1px);
            background-size: 64px 64px;
            background-position: center top;
            mask-image: linear-gradient(to bottom, black 0, transparent 640px);
            opacity: 0.48;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                linear-gradient(
                    to right,
                    transparent calc(50% - (var(--content-width) / 2) - 1px),
                    var(--diagram-soft) calc(50% - (var(--content-width) / 2)),
                    transparent calc(50% - (var(--content-width) / 2) + 1px),
                    transparent calc(50% + (var(--content-width) / 2) - 1px),
                    var(--diagram-soft) calc(50% + (var(--content-width) / 2)),
                    transparent calc(50% + (var(--content-width) / 2) + 1px)
                );
        }

        img,
        svg {
            display: block;
            max-width: 100%;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration-color: color-mix(in oklab, currentColor 32%, transparent);
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            transition:
                color 160ms ease,
                background-color 160ms ease,
                text-decoration-color 160ms ease,
                transform 160ms ease;
        }

        a:hover {
            text-decoration-color: currentColor;
        }

        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 3px;
        }

        ::selection {
            background: var(--selection);
            color: var(--selection-foreground);
        }

        [id] {
            scroll-margin-top: calc(var(--header-height) + 20px);
        }

        .skip-link {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 100;
            padding: 8px 12px;
            border: var(--hairline) solid var(--border);
            background: var(--background);
            color: var(--foreground);
            font-family: var(--font-mono);
            font-size: 12px;
            transform: translateY(-160%);
            transition: transform 160ms ease;
        }

        .skip-link:focus {
            transform: translateY(0);
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            height: var(--header-height);
            border-bottom: var(--hairline) solid var(--line);
            background: var(--header-background);
            backdrop-filter: blur(16px) saturate(140%);
        }

        .site-header-inner {
            width: min(calc(100% - 16px), var(--content-width));
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 10px;
            border-inline: var(--hairline) solid var(--line);
        }

        .site-mark {
            flex: 0 0 auto;
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border: 1px solid var(--foreground);
            background: var(--foreground);
            color: var(--background);
            font-family: var(--font-mono);
            font-size: 17px;
            font-weight: 600;
            line-height: 1;
            text-decoration: none;
            letter-spacing: -0.08em;
        }

        .site-nav {
            min-width: 0;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 1px;
        }

        .site-nav-list {
            display: flex;
            align-items: center;
            gap: 1px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .site-nav-item {
            margin: 0;
        }

        .site-nav a {
            position: relative;
            display: inline-flex;
            align-items: center;
            height: 30px;
            padding: 0 8px;
            border-radius: 6px;
            color: var(--muted-foreground);
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
        }

        .site-nav a:hover,
        .site-nav a[aria-current="true"] {
            background: var(--muted);
            color: var(--foreground);
        }

        .header-actions,
        .site-actions {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 7px;
            padding-left: 8px;
            border-left: var(--hairline) solid var(--line);
        }

        .theme-switch {
            display: flex;
            align-items: center;
        }

        .theme-switch-label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .theme-switch-options {
            display: inline-grid;
            grid-template-columns: repeat(3, 28px);
            gap: 2px;
            padding: 2px;
            border: var(--hairline) solid var(--border);
            border-radius: 8px;
            background: var(--surface);
        }

        .theme-switch-options button {
            appearance: none;
            display: inline-grid;
            place-items: center;
            width: 28px;
            height: 24px;
            padding: 0;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 0;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            overflow: hidden;
        }

        .theme-switch-options button::after {
            font-size: 9px;
        }

        .theme-switch-options button[data-theme-option="light"]::after {
            content: "L";
        }

        .theme-switch-options button[data-theme-option="dark"]::after {
            content: "D";
        }

        .theme-switch-options button[data-theme-option="system"]::after {
            content: "S";
        }

        .theme-switch-options button:hover {
            background: var(--muted);
            color: var(--foreground);
        }

        .theme-switch-options button[aria-pressed="true"] {
            background: var(--foreground);
            color: var(--background);
        }

        .export-button,
        .export-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0 9px;
            border: var(--hairline) solid var(--border);
            border-radius: 7px;
            background: var(--surface);
            color: var(--foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .export-button:hover,
        .export-link:hover {
            border-color: var(--foreground);
            background: var(--foreground);
            color: var(--background);
        }

        .page,
        .resume-main {
            width: 100%;
        }

        .rail,
        .rail-section,
        .panel-rail,
        .hero,
        .section,
        .resume-section,
        .site-footer-inner {
            position: relative;
            width: min(calc(100% - 16px), var(--content-width));
            margin-inline: auto;
            border-inline: var(--hairline) solid var(--line);
        }

        /*
         * 全屏贯穿线：从视口左缘延伸到右缘的 1px 细线，穿过内容轨道两侧的留白。
         * 这是参考站工程图纸语言的核心 —— 内容轨道保持透明，线才能真正贯穿。
         */
        .screen-line-top::before,
        .screen-line-bottom::after {
            content: "";
            position: absolute;
            left: 50%;
            z-index: 0;
            width: 100vw;
            height: 1px;
            transform: translateX(-50%);
            background: var(--line);
            pointer-events: none;
        }

        .screen-line-top::before {
            top: 0;
        }

        .screen-line-bottom::after {
            bottom: 0;
        }

        /* 虚线变体用于区块内部的次级分隔，弱于实线一档 */
        .screen-dashed-line-top::before,
        .screen-dashed-line-bottom::after {
            background:
                linear-gradient(to right, var(--line) 4px, transparent 2px)
                repeat-x;
            background-size: 6px 1px;
        }

        .hero {
            overflow: visible;
        }

        .hero-visual {
            position: relative;
            min-height: 310px;
            overflow: hidden;
            border-bottom: var(--hairline) solid var(--line);
            background-image:
                linear-gradient(to right, var(--diagram-soft) 1px, transparent 1px),
                linear-gradient(to bottom, var(--diagram-soft) 1px, transparent 1px),
                radial-gradient(circle at 72% 35%, var(--diagram-soft), transparent 44%);
            background-size: 72px 72px, 72px 72px, auto;
            isolation: isolate;
        }

        .hero-visual::after {
            content: "FIG_001";
            position: absolute;
            right: 16px;
            bottom: 14px;
            z-index: 2;
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.05em;
        }

        .hero-diagram {
            position: absolute;
            inset: clamp(14px, 3vw, 28px) clamp(16px, 4vw, 48px) 12px;
            width: calc(100% - clamp(32px, 8vw, 96px));
            height: calc(100% - clamp(26px, 6vw, 56px));
        }

        .hero-diagram > svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /*
         * 等距积木标志（复刻 chanhdai.com 的 isometric mark 技法）。
         * 颜色 token 全部派生自 --foreground / --background，自动适配明暗主题。
         */
        .iso-mark {
            --iso-stroke: color-mix(in oklab, var(--foreground) 26%, var(--background));
            --iso-pattern: color-mix(in oklab, var(--foreground) 13%, var(--background));
            --iso-top: color-mix(in oklab, var(--foreground) 5%, var(--background));
            --iso-line: color-mix(in oklab, var(--foreground) 12%, var(--background));
            cursor: pointer;
            touch-action: manipulation;
        }

        /* 背景贯穿虚线，藏在积木之后 */
        .iso-mark .iso-lines {
            fill: none;
            stroke: var(--iso-line);
            stroke-width: 1;
            stroke-dasharray: 4 3;
        }

        /* 点按下沉：整组积木随 spring 曲线向下压 */
        .iso-mark .iso-blocks {
            transition: transform var(--duration) var(--ease-out);
        }

        .iso-mark .iso-blocks.is-pressed {
            transform: translateY(11px);
        }

        /* 不透明底面，遮住背后的网格与虚线 */
        .iso-mark .iso-base path {
            fill: var(--background);
            stroke: none;
        }

        /* 顶面浅色实填，侧面斜纹填充 */
        .iso-mark .iso-tops path {
            fill: var(--iso-top);
            stroke: none;
        }

        .iso-mark .iso-sides path {
            fill: url(#iso-stripe);
            stroke: none;
        }

        /* 立方体棱线：先铺基础描边，再叠一层鼠标跟随的渐变描边 */
        .iso-mark .iso-edges path {
            fill: none;
            stroke: var(--iso-stroke);
            stroke-width: 1;
            stroke-linejoin: round;
        }

        .iso-mark .iso-edges-glow path {
            stroke: url(#iso-glow);
        }

        .iso-mark .iso-glow-near {
            stop-color: oklch(0.42 0 0);
        }

        html[data-theme="dark"] .iso-mark .iso-glow-near {
            stop-color: oklch(0.985 0 0);
        }

        html[data-theme="dark"] .iso-mark .iso-glow-far {
            stop-color: oklch(0.7 0 0);
        }

        @media (min-resolution: 2dppx) {
            .iso-mark .iso-edges path {
                stroke-width: 0.75;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .iso-mark .iso-blocks {
                transition: none;
            }
        }

        .hero-identity,
        .hero-identity-row {
            position: relative;
            z-index: 3;
            display: grid;
            grid-template-columns: 124px minmax(0, 1fr);
            align-items: end;
            gap: 18px;
            min-height: 102px;
            padding: 0 var(--rail-padding) 18px;
            margin-top: -58px;
        }

        /* hero 内部的分区线同样贯穿全屏，保持与下方区块一致的图纸感 */
        .hero-identity::before,
        .hero-summary-block::before,
        .hero-metrics::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            z-index: 0;
            width: 100vw;
            height: 1px;
            transform: translateX(-50%);
            background: var(--line);
            pointer-events: none;
        }

        .portrait-shell,
        .portrait-frame,
        .avatar-frame {
            position: relative;
        }

        .portrait-shell {
            align-self: end;
            margin: 0;
        }

        .portrait-frame,
        .avatar-frame {
            width: 124px;
            aspect-ratio: 1;
            padding: 5px;
            border: var(--hairline) solid var(--line);
            border-radius: 50%;
            background: var(--background);
        }

        .portrait-frame img,
        .avatar-frame img,
        .portrait-shell img {
            width: 100%;
            height: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            object-position: center 18%;
            border-radius: 50%;
            background: var(--surface-strong);
            filter: saturate(0.72) contrast(1.04);
        }

        .portrait-badge,
        .portrait-caption {
            display: none;
        }

        .hero-copy,
        .hero-heading {
            min-width: 0;
            display: grid;
            gap: 5px;
            padding-bottom: 4px;
        }

        .eyebrow,
        .figure-label {
            margin: 0;
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-name {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 500;
            line-height: 0.95;
            letter-spacing: -0.055em;
            text-wrap: balance;
        }

        .hero-kicker {
            margin: 0;
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 400;
            line-height: 1.45;
            text-wrap: pretty;
        }

        .hero-summary-block,
        .hero-intro,
        .hero-summary-row {
            position: relative;
            display: grid;
            gap: 13px;
            padding: 24px var(--rail-padding) 26px;
        }

        .hero-tagline {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
        }

        .hero-summary {
            max-width: 68ch;
            margin: 0;
            color: var(--muted-foreground);
            font-size: 14px;
            line-height: 1.75;
            text-wrap: pretty;
        }

        .hero-metrics {
            position: relative;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            margin: 0;
        }

        .metric {
            min-width: 0;
            min-height: 74px;
            display: grid;
            grid-template-columns: minmax(88px, 0.42fr) minmax(0, 1fr);
            align-items: start;
            gap: 14px;
            padding: 16px var(--rail-padding);
            border-bottom: var(--hairline) solid var(--line);
            background: transparent;
        }

        .metric:nth-child(odd) {
            border-right: var(--hairline) solid var(--line);
        }

        .metric-label,
        .card-label,
        .section-label,
        .detail-term,
        .block-label,
        .period-caption,
        .list-kicker {
            margin: 0;
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .metric-value {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .section,
        .resume-section,
        .rail-section.section {
            display: grid;
            gap: 0;
            margin-top: 32px;
        }

        /*
         * 区块之间的斜纹分隔带：315° 斜线、10px 网格，与参考站同一套纹理参数。
         * 自身上下边即两条全屏贯穿线，因此区块顶部不再另画线。
         */
        .section::before,
        .resume-section::before {
            content: "";
            position: absolute;
            z-index: 0;
            top: calc(var(--separator-height) * -1);
            left: 50%;
            width: 100vw;
            height: var(--separator-height);
            transform: translateX(-50%);
            border-block: 1px solid var(--line);
            background: repeating-linear-gradient(
                315deg,
                var(--pattern-foreground) 0,
                var(--pattern-foreground) 1px,
                transparent 0,
                transparent 50%
            );
            background-size: 10px 10px;
        }

        /* 区块底部收一条贯穿线，与顶部的分隔带上下呼应 */
        .section::after,
        .resume-section::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            z-index: 0;
            width: 100vw;
            height: 1px;
            transform: translateX(-50%);
            background: var(--line);
            pointer-events: none;
        }

        .section-header {
            position: relative;
            display: grid;
            gap: 5px;
            padding: 20px var(--rail-padding) 18px;
        }

        .section-header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            z-index: 0;
            width: 100vw;
            height: 1px;
            transform: translateX(-50%);
            background: var(--line);
            pointer-events: none;
        }

        .section-title {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 1.875rem);
            font-weight: 500;
            line-height: 1.15;
            letter-spacing: -0.035em;
            text-wrap: balance;
        }

        .intro-grid,
        .intro-list,
        .experience-stack,
        .editorial-list {
            display: grid;
        }

        .info-card {
            display: grid;
            gap: 13px;
            padding: 20px var(--rail-padding);
            border-bottom: var(--hairline) solid var(--line);
            background: transparent;
            transition: background-color 160ms ease;
        }

        .info-row-heading,
        .info-row-content {
            display: grid;
            gap: 8px;
            min-width: 0;
        }

        .card-title {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.35;
            letter-spacing: -0.02em;
        }

        .lead-text {
            max-width: 68ch;
            margin: 0;
            color: var(--muted-foreground);
            font-size: 14px;
            line-height: 1.75;
            text-wrap: pretty;
        }

        .detail-list {
            display: grid;
        }

        .detail-row {
            display: grid;
            grid-template-columns: minmax(110px, 0.36fr) minmax(0, 1fr);
            gap: 16px;
            padding: 10px 0;
            border-top: var(--hairline) solid var(--line);
        }

        .detail-desc {
            min-width: 0;
            margin: 0;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        .tone-inverse {
            background: transparent;
            color: inherit;
        }

        .skill-wall {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            padding: 20px var(--rail-padding) 24px;
            border-bottom: var(--hairline) solid var(--line);
        }

        .skill-list {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin: 0;
            padding: 0;
            border-bottom: var(--hairline) solid var(--line);
            list-style: none;
            counter-reset: skill-index;
        }

        .skill-list .skill-row {
            min-width: 0;
            min-height: 42px;
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr);
            align-items: center;
            gap: 9px;
            padding: 7px 12px;
            border-right: var(--hairline) solid var(--line);
            border-bottom: var(--hairline) solid var(--line);
            border-top: 0;
            border-left: 0;
            border-radius: 0;
            background: transparent;
            color: var(--foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            line-height: 1.35;
            overflow-wrap: anywhere;
            transition: background-color 160ms ease;
            counter-increment: skill-index;
        }

        .skill-list .skill-row::before {
            content: counter(skill-index, decimal-leading-zero);
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 9px;
            font-variant-numeric: tabular-nums;
        }

        .skill-list .skill-row:nth-child(3n) {
            border-right: 0;
        }

        .skill-index {
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 9px;
            font-variant-numeric: tabular-nums;
        }

        .skill-row .skill-tag {
            min-height: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: var(--foreground);
            overflow-wrap: anywhere;
        }

        .skill-tag {
            display: inline-flex;
            align-items: center;
            min-height: 27px;
            padding: 4px 8px;
            border: var(--hairline) solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            line-height: 1.25;
            transition:
                color 160ms ease,
                border-color 160ms ease,
                background-color 160ms ease,
                transform 160ms ease;
        }

        .period-marker {
            display: grid;
            grid-template-columns: minmax(110px, 0.36fr) minmax(0, 1fr);
            gap: 16px;
            align-items: baseline;
            padding: 14px var(--rail-padding);
            border-bottom: var(--hairline) solid var(--line);
            background:
                repeating-linear-gradient(
                    135deg,
                    transparent 0 6px,
                    var(--diagram-soft) 6px 7px
                );
        }

        .period-value {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
        }

        .experience-card,
        .experience-item {
            display: grid;
            border-bottom: var(--hairline) solid var(--line);
            background: transparent;
            transition: background-color 160ms ease;
        }

        .experience-head {
            display: grid;
            gap: 7px;
            padding: 20px var(--rail-padding) 16px;
        }

        .experience-company {
            margin: 0;
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: 0.03em;
        }

        .experience-role,
        .project-title {
            margin: 0;
            font-size: clamp(1.05rem, 3.5vw, 1.28rem);
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: -0.025em;
            text-wrap: pretty;
        }

        .experience-body,
        .experience-preview,
        .experience-expanded {
            display: grid;
        }

        .block {
            display: grid;
            gap: 8px;
            padding: 14px var(--rail-padding);
            border-top: var(--hairline) solid var(--line);
        }

        .block p,
        .block li {
            max-width: 70ch;
            margin: 0;
            color: var(--muted-foreground);
            font-size: 13px;
            line-height: 1.75;
            text-wrap: pretty;
        }

        .block ul {
            display: grid;
            gap: 9px;
            margin: 0;
            padding-left: 18px;
        }

        .experience-preview .block--overview p:not(.block-label) {
            display: -webkit-box;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
        }

        .experience-card:has(.experience-details[open]) .experience-preview .block--overview p:not(.block-label),
        .experience-item:has(.experience-details[open]) .experience-preview .block--overview p:not(.block-label) {
            display: block;
            overflow: visible;
            -webkit-line-clamp: unset;
        }

        .experience-details {
            border-top: var(--hairline) solid var(--line);
        }

        .experience-details summary {
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 9px var(--rail-padding);
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            list-style: none;
            user-select: none;
            transition:
                color 160ms ease,
                background-color 160ms ease;
        }

        .experience-details summary::-webkit-details-marker {
            display: none;
        }

        .experience-details summary::after {
            content: "+";
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border: var(--hairline) solid var(--border);
            border-radius: 6px;
            color: var(--foreground);
            font-size: 14px;
            line-height: 1;
            transition: transform 200ms var(--ease-out);
        }

        .experience-details-summary:has(.details-icon)::after {
            display: none;
        }

        .details-icon {
            flex: 0 0 auto;
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border: var(--hairline) solid var(--border);
            border-radius: 6px;
            color: var(--foreground);
            font-size: 14px;
            line-height: 1;
            transition: transform 200ms var(--ease-out);
        }

        .experience-details[open] .details-icon {
            transform: rotate(45deg);
        }

        .experience-details[open] summary::after {
            transform: rotate(45deg);
        }

        .experience-details summary:hover {
            background: var(--muted);
            color: var(--foreground);
        }

        .details-label-open {
            display: none;
        }

        .experience-details[open] .details-label-closed {
            display: none;
        }

        .experience-details[open] .details-label-open {
            display: inline;
        }

        .editorial-item {
            position: relative;
            display: grid;
            grid-template-columns: 92px minmax(0, 1fr) minmax(120px, 0.4fr);
            gap: 16px;
            align-items: start;
            padding: 18px var(--rail-padding);
            border-bottom: var(--hairline) solid var(--line);
            background: transparent;
            transition: background-color 160ms ease;
        }

        .editorial-item::after {
            content: "↗";
            position: absolute;
            top: 18px;
            right: var(--rail-padding);
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 11px;
        }

        .editorial-copy {
            min-width: 0;
            display: grid;
            gap: 7px;
        }

        .editorial-arrow {
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 11px;
        }

        .editorial-badge {
            grid-column: 2 / -1;
        }

        .list-title {
            min-width: 0;
            margin: 0;
            padding-right: 22px;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: -0.015em;
            text-wrap: pretty;
        }

        .list-meta {
            margin: 0;
            padding-right: 22px;
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            line-height: 1.55;
        }

        .editorial-item img {
            grid-column: 2 / -1;
            width: fit-content;
            max-width: 100%;
            filter: grayscale(1);
        }

        .thanks-card {
            display: grid;
            gap: 10px;
            padding: 22px var(--rail-padding) 28px;
            border-bottom: var(--hairline) solid var(--line);
        }

        .thanks-message {
            max-width: 64ch;
            margin: 0;
            font-size: 16px;
            line-height: 1.65;
            letter-spacing: -0.015em;
            text-wrap: pretty;
        }

        .site-footer {
            margin-top: 32px;
            border-top: var(--hairline) solid var(--line);
        }

        .site-footer-inner {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 18px;
            align-items: start;
            padding: 24px var(--rail-padding) 68px;
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-size: 10px;
            line-height: 1.7;
        }

        .site-footer p {
            margin: 0;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 12px;
        }

        [data-aos="hero-rise"],
        [data-aos="section-rise"],
        [data-aos="card-rise"],
        [data-aos="marker-slide"] {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition:
                opacity var(--duration) var(--ease-out) var(--motion-delay, 0ms),
                transform var(--duration) var(--ease-out) var(--motion-delay, 0ms),
                background-color 160ms ease;
            will-change: opacity, transform;
        }

        [data-aos="hero-rise"].aos-init:not(.aos-animate),
        [data-aos="section-rise"].aos-init:not(.aos-animate) {
            opacity: 0;
            transform: translate3d(0, 10px, 0);
        }

        [data-aos="card-rise"].aos-init:not(.aos-animate) {
            opacity: 0;
            transform: translate3d(0, 12px, 0);
        }

        [data-aos="marker-slide"].aos-init:not(.aos-animate) {
            opacity: 0;
            transform: translate3d(-10px, 0, 0);
        }

        [data-aos][data-aos-delay="40"] {
            --motion-delay: 40ms;
        }

        [data-aos][data-aos-delay="50"] {
            --motion-delay: 50ms;
        }

        [data-aos][data-aos-delay="80"] {
            --motion-delay: 80ms;
        }

        [data-aos][data-aos-delay="100"] {
            --motion-delay: 100ms;
        }

        [data-aos][data-aos-delay="120"] {
            --motion-delay: 120ms;
        }

        [data-aos][data-aos-delay="150"] {
            --motion-delay: 150ms;
        }

        .motion-sequence .motion-child {
            transition:
                opacity 400ms var(--ease-out),
                transform 400ms var(--ease-out),
                color 160ms ease,
                border-color 160ms ease,
                background-color 160ms ease;
        }

        .motion-sequence.aos-init:not(.aos-animate) .motion-child {
            opacity: 0;
            transform: translate3d(0, 8px, 0);
        }

        .motion-sequence.aos-animate .motion-child {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        @media (hover: hover) and (pointer: fine) {
            .site-mark:hover,
            .theme-switch-options button:hover,
            .export-button:hover,
            .export-link:hover {
                transform: translateY(-1px);
            }

            .info-card:hover,
            .experience-card:hover,
            .experience-item:hover,
            .editorial-item:hover {
                background: color-mix(in oklab, var(--muted) 55%, transparent);
            }

            .skill-tag:hover {
                transform: translateY(-1px);
                border-color: var(--foreground);
                background: var(--foreground);
                color: var(--background);
            }

            .skill-list .skill-row:hover {
                transform: none;
            }
        }

        @media (max-width: 900px) {
            .site-nav {
                display: none;
            }

            .header-actions,
            .site-actions {
                margin-left: auto;
            }
        }

        @media (max-width: 600px) {
            :root {
                --rail-padding: 18px;
            }

            body::after {
                display: none;
            }

            .site-header-inner,
            .rail,
            .rail-section,
            .panel-rail,
            .hero,
            .section,
            .resume-section,
            .site-footer-inner {
                width: calc(100% - 12px);
            }

            .site-header-inner {
                gap: 8px;
                padding-inline: 7px;
            }

            .site-mark {
                width: 28px;
                height: 28px;
            }

            .theme-switch-options {
                grid-template-columns: repeat(3, 25px);
            }

            .theme-switch-options button {
                width: 25px;
            }

            .export-button,
            .export-link {
                padding-inline: 8px;
            }

            .hero-visual {
                min-height: 240px;
            }

            .hero-diagram {
                inset: 24px 14px 16px;
                width: calc(100% - 28px);
                height: calc(100% - 40px);
            }

            .hero-identity {
                grid-template-columns: 96px minmax(0, 1fr);
                gap: 14px;
                min-height: 82px;
                margin-top: -46px;
                padding-bottom: 15px;
            }

            .portrait-frame,
            .avatar-frame {
                width: 96px;
            }

            .hero-name {
                font-size: clamp(1.8rem, 10vw, 2.35rem);
            }

            .hero-kicker {
                font-size: 10px;
            }

            .hero-summary-block,
            .hero-intro {
                padding-block: 20px 22px;
            }

            .hero-summary {
                font-size: 13px;
            }

            .hero-metrics {
                grid-template-columns: 1fr;
            }

            .metric:nth-child(odd) {
                border-right: 0;
            }

            .metric {
                grid-template-columns: 92px minmax(0, 1fr);
                min-height: 0;
                padding-block: 13px;
            }

            .section-title {
                font-size: 1.3rem;
            }

            .detail-row,
            .period-marker {
                grid-template-columns: 92px minmax(0, 1fr);
                gap: 12px;
            }

            .editorial-item {
                grid-template-columns: 72px minmax(0, 1fr);
                gap: 12px;
            }

            .list-meta {
                grid-column: 2;
            }

            .editorial-item img {
                grid-column: 2;
            }

            .site-footer-inner {
                grid-template-columns: 1fr;
            }

            .footer-links {
                justify-content: flex-start;
            }

            .skill-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .skill-list .skill-row:nth-child(3n) {
                border-right: var(--hairline) solid var(--line);
            }

            .skill-list .skill-row:nth-child(2n) {
                border-right: 0;
            }
        }

        @page {
            size: A4;
            margin: 12mm 10mm 14mm;
        }

        @media print {
            :root,
            html[data-theme="dark"] {
                --background: #ffffff;
                --foreground: #111111;
                --surface: #ffffff;
                --surface-strong: #f5f5f5;
                --muted: #f4f4f5;
                --muted-foreground: #52525b;
                --border: #d4d4d8;
                --line: #e4e4e7;
                --focus: #111111;
                --diagram-soft: #eeeeef;
            }

            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            html,
            body {
                background: #ffffff !important;
                color: #111111 !important;
            }

            body {
                min-height: 0;
                font-size: 10pt;
            }

            body::before,
            body::after,
            .site-header,
            .skip-link,
            .section::before,
            .section::after,
            .resume-section::before,
            .resume-section::after,
            .section-header::after,
            .hero-identity::before,
            .hero-summary-block::before,
            .hero-metrics::before,
            .screen-line-top::before,
            .screen-line-bottom::after,
            .site-footer {
                display: none !important;
            }

            /* 打印时贯穿线退化为普通分隔边，避免 100vw 溢出纸张 */
            .section-header,
            .hero-identity,
            .hero-summary-block {
                border-bottom: var(--hairline) solid var(--line);
            }

            .rail,
            .rail-section,
            .panel-rail,
            .hero,
            .section,
            .resume-section {
                width: auto;
                border-inline: 0;
                background: #ffffff;
            }

            .section,
            .resume-section {
                margin-top: 6mm;
                border-top: var(--hairline) solid var(--line);
            }

            .hero-visual {
                min-height: 54mm;
            }

            .hero-identity {
                grid-template-columns: 28mm minmax(0, 1fr);
                margin-top: -15mm;
            }

            .portrait-frame,
            .avatar-frame {
                width: 28mm;
            }

            .hero-summary-block,
            .hero-intro,
            .section-header,
            .info-card,
            .skill-wall,
            .experience-head,
            .block,
            .editorial-item,
            .thanks-card,
            .metric,
            .period-marker {
                padding-left: 4mm;
                padding-right: 4mm;
            }

            .experience-details summary {
                display: none !important;
            }

            .experience-details > *:not(summary) {
                display: block !important;
            }

            .experience-preview .block--overview p:not(.block-label) {
                display: block !important;
                overflow: visible !important;
                -webkit-line-clamp: unset !important;
            }

            .experience-card,
            .experience-item {
                break-inside: auto;
                page-break-inside: auto;
            }

            .section-header,
            .experience-head,
            .period-marker,
            .block,
            .info-card,
            .editorial-item,
            .metric {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .section-header,
            .experience-head,
            .period-marker,
            .block-label {
                break-after: avoid;
                page-break-after: avoid;
            }

            [data-aos],
            .motion-sequence .motion-child {
                opacity: 1 !important;
                transform: none !important;
                transition: none !important;
                animation: none !important;
            }

            p,
            li {
                orphans: 3;
                widows: 3;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }

            [data-aos],
            .motion-sequence .motion-child {
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>

    <script>
        (function () {
            var storageKey = "resume-theme-mode";
            var root = document.documentElement;
            var themeButtons = Array.prototype.slice.call(document.querySelectorAll("[data-theme-option]"));
            var mediaQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
            var reducedMotionQuery = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
            var themeColorMeta = document.getElementById("theme-color");
            var printDetailStates = [];

            function normalizeMode(mode) {
                return mode === "light" || mode === "dark" || mode === "system" ? mode : "system";
            }

            function resolveTheme(mode) {
                if (mode === "system") {
                    return mediaQuery && mediaQuery.matches ? "dark" : "light";
                }

                return mode;
            }

            function readStoredMode() {
                try {
                    return normalizeMode(localStorage.getItem(storageKey));
                } catch (error) {
                    return "system";
                }
            }

            function syncControls(mode) {
                themeButtons.forEach(function (button) {
                    var isActive = button.dataset.themeOption === mode;
                    button.setAttribute("aria-pressed", String(isActive));
                });
            }

            function persistMode(mode) {
                try {
                    localStorage.setItem(storageKey, mode);
                } catch (error) {
                    return;
                }
            }

            function applyTheme(mode, persist) {
                var nextMode = normalizeMode(mode);
                var nextTheme = resolveTheme(nextMode);

                root.dataset.themeMode = nextMode;
                root.dataset.theme = nextTheme;
                root.style.colorScheme = nextTheme;
                if (themeColorMeta) {
                    themeColorMeta.setAttribute("content", nextTheme === "dark" ? "#09090b" : "#ffffff");
                }
                syncControls(nextMode);

                if (persist) {
                    persistMode(nextMode);
                }
            }

            function openDetailsForPrint() {
                var details = Array.prototype.slice.call(document.querySelectorAll(".experience-details"));
                printDetailStates = details.map(function (detail) {
                    return detail.open;
                });
                details.forEach(function (detail) {
                    detail.open = true;
                });
            }

            function restoreDetailsAfterPrint() {
                var details = Array.prototype.slice.call(document.querySelectorAll(".experience-details"));
                details.forEach(function (detail, index) {
                    detail.open = Boolean(printDetailStates[index]);
                });
                printDetailStates = [];
            }

            function setupActiveNavigation() {
                if (!("IntersectionObserver" in window)) {
                    return;
                }

                var links = Array.prototype.slice.call(document.querySelectorAll(".site-nav a[href^='#']"));
                var targets = links
                    .map(function (link) {
                        var id = link.getAttribute("href").slice(1);
                        var section = document.getElementById(id);
                        return section ? { link: link, section: section } : null;
                    })
                    .filter(Boolean);

                if (!targets.length) {
                    return;
                }

                var observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (!entry.isIntersecting) {
                            return;
                        }

                        targets.forEach(function (target) {
                            if (target.section === entry.target) {
                                target.link.setAttribute("aria-current", "true");
                            } else {
                                target.link.removeAttribute("aria-current");
                            }
                        });
                    });
                }, {
                    rootMargin: "-20% 0px -70% 0px",
                    threshold: 0
                });

                targets.forEach(function (target) {
                    observer.observe(target.section);
                });
            }

            themeButtons.forEach(function (button) {
                button.addEventListener("click", function () {
                    applyTheme(button.dataset.themeOption, true);
                });
            });

            if (mediaQuery) {
                var handleSystemThemeChange = function () {
                    if (normalizeMode(root.dataset.themeMode) === "system") {
                        applyTheme("system", false);
                    }
                };

                if (typeof mediaQuery.addEventListener === "function") {
                    mediaQuery.addEventListener("change", handleSystemThemeChange);
                } else if (typeof mediaQuery.addListener === "function") {
                    mediaQuery.addListener(handleSystemThemeChange);
                }
            }

            function setupIsometricMark() {
                var svg = document.querySelector(".iso-mark");
                if (!svg) {
                    return;
                }

                var blocks = svg.querySelector(".iso-blocks");
                var reduceMotion = reducedMotionQuery && reducedMotionQuery.matches;

                // 点按下沉：spring 感由 CSS transition 承担，这里只切换状态类
                if (blocks && !reduceMotion) {
                    var press = function () { blocks.classList.add("is-pressed"); };
                    var release = function () { blocks.classList.remove("is-pressed"); };
                    svg.addEventListener("pointerdown", press);
                    svg.addEventListener("pointerup", release);
                    svg.addEventListener("pointerleave", release);
                    svg.addEventListener("pointercancel", release);
                }

                // 鼠标跟随的径向渐变描边：仅在支持 hover 的设备上启用
                var glow = svg.querySelector("#iso-glow");
                var canHover = window.matchMedia ? window.matchMedia("(hover: hover)").matches : true;
                if (!glow || reduceMotion || !canHover) {
                    return;
                }

                var view = svg.viewBox.baseVal;
                var targetX = view.width / 2;
                var targetY = view.height / 2;
                var currentX = targetX;
                var currentY = targetY;
                var frame = null;

                function step() {
                    currentX += (targetX - currentX) * 0.14;
                    currentY += (targetY - currentY) * 0.14;
                    glow.setAttribute("cx", currentX.toFixed(1));
                    glow.setAttribute("cy", currentY.toFixed(1));

                    if (Math.abs(targetX - currentX) > 0.4 || Math.abs(targetY - currentY) > 0.4) {
                        frame = window.requestAnimationFrame(step);
                    } else {
                        frame = null;
                    }
                }

                window.addEventListener("pointermove", function (event) {
                    var rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return;
                    }
                    targetX = ((event.clientX - rect.left) / rect.width) * view.width;
                    targetY = ((event.clientY - rect.top) / rect.height) * view.height;
                    if (frame === null) {
                        frame = window.requestAnimationFrame(step);
                    }
                }, { passive: true });
            }

            window.addEventListener("beforeprint", openDetailsForPrint);
            window.addEventListener("afterprint", restoreDetailsAfterPrint);

            applyTheme(readStoredMode(), false);
            setupActiveNavigation();
            setupIsometricMark();

            if (!(reducedMotionQuery && reducedMotionQuery.matches) && window.AOS) {
                AOS.init({
                    duration: 460,
                    easing: "cubic-bezier(0.16, 1, 0.3, 1)",
                    once: true,
                    mirror: false,
                    offset: 16,
                    anchorPlacement: "top-bottom"
                });
            }
        }());
    </script>
</body>

</html>
